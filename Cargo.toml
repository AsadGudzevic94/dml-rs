[workspace]
resolver = "2"
members = ["crates/dml-core", "crates/dml-py"]
# The R package builds its own crate (r/dmlrs/src/rust) with R's toolchain.
exclude = ["r"]
# `cargo test` / `cargo build` at the root skip the Python extension, which
# needs a Python interpreter to build; use `-p dml-py` or maturin for it.
default-members = ["crates/dml-core"]

[workspace.package]
version = "0.24.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Asad Gudzevic <asadgudzevic94@gmail.com>"]
repository = "https://github.com/AsadGudzevic94/dml-rs"
rust-version = "1.80"

[workspace.dependencies]
ndarray = "0.16"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
rayon = "1.10"
rand_distr = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
criterion = { version = "0.5", default-features = false }
