# Publish dml-core to crates.io when a version tag is pushed.
#
#   git tag -a v0.2.0 -m "dml-rs 0.2.0" && git push origin v0.2.0
#
# Uses crates.io Trusted Publishing: GitHub's OIDC token is exchanged for a
# short-lived crates.io token, so no API token is stored anywhere. crates.io
# trusts this workflow file, in this repository, in the `crates-io` GitHub
# environment (configured on the crate's Settings page on crates.io).
# The Python wheels for the same tag are built and published by wheels.yml.
name: release-crate

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: publish dml-core to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/dml-core
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag and whether this version is already published
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml version: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "dml-rs release workflow (github.com/AsadGudzevic94/dml-rs)" \
            "https://crates.io/api/v1/crates/dml-core/$version")
          if [ "$code" = "200" ]; then
            echo "dml-core $version is already on crates.io; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.check.outputs.published != 'true'
        run: cargo test -p dml-core

      - name: Get a short-lived crates.io token
        if: steps.check.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: cargo publish -p dml-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
