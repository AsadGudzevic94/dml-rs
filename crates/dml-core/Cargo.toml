[package]
name = "dml-core"
description = "Double / debiased machine learning for causal inference in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/dml-core"
homepage = "https://asadgudzevic94.github.io/dml-rs/"
# DoubleML parity fixtures (~3 MB) and benches are for development only.
exclude = ["tests/fixtures/", "tests/parity.rs", "tests/common/", "benches/"]
keywords = ["causal-inference", "double-ml", "statistics", "econometrics", "machine-learning"]
categories = ["science", "mathematics"]

[dependencies]
ndarray.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
thiserror.workspace = true
rayon = { workspace = true, optional = true }

[features]
default = ["parallel"]
## Fit cross-fitting folds on a rayon thread pool.
parallel = ["dep:rayon"]

[dev-dependencies]
# Correctly rounded float parsing, so fixtures replay bit for bit.
serde_json = { workspace = true, features = ["float_roundtrip"] }
criterion.workspace = true

[[bench]]
name = "plr"
harness = false

[package.metadata.docs.rs]
all-features = true
