name: R package

on:
  push:
    branches: [main, cran-prep]
    paths: ["r/**", "crates/dml-core/**", ".github/workflows/r.yml"]
  pull_request:
    paths: ["r/**", "crates/dml-core/**", ".github/workflows/r.yml"]

jobs:
  check:
    # R CMD check --as-cran on the CRAN tarball (r/build-cran.sh: Rust crates bundled, dml-core from
    # crates.io), failing on warnings. The rust job repeats it with the oldest supported Rust.
    name: R CMD check --as-cran (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.80"
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      # CRAN flags examples and tests that use more than about two cores.
      _R_CHECK_EXAMPLE_TIMING_CPU_TO_ELAPSED_THRESHOLD_: 2.5
      _R_CHECK_TEST_TIMING_CPU_TO_ELAPSED_THRESHOLD_: 2.5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The tarball is always built with stable cargo (its resolver picks crate versions that
      # support the package's minimum Rust version); the check then uses matrix.rust.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/dmlrs
          extra-packages: any::rcmdcheck
          needs: check
      - name: Build the CRAN tarball
        run: PYTHON=python r/build-cran.sh r
      - name: AUTHORS is up to date
        run: git diff --exit-code r/dmlrs/inst/AUTHORS
      - if: matrix.rust != 'stable'
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal
          rustup default ${{ matrix.rust }}
      - name: R CMD check
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(Sys.glob("r/dmlrs_*.tar.gz"), args = c("--as-cran", "--no-manual"), error_on = "warning", check_dir = "check")'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.os }}-${{ matrix.rust }}
          path: check

  local-core:
    # The tests against the dml-core in this repository (src/.cargo/config.toml patches it in),
    # from the git sources as r-universe builds them (crates downloaded, not bundled).
    name: tests against local dml-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/dmlrs
          extra-packages: any::testthat
      - run: R CMD INSTALL r/dmlrs
      - run: Rscript -e 'testthat::test_local("r/dmlrs", load_package = "installed")'
